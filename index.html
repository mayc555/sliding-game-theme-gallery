<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#111827"><title>滑行游戏 · 主题方向图集</title><style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#101420;color:#f6f4ef}*{box-sizing:border-box}body{margin:0}a{color:inherit}header{padding:24px max(24px,calc((100vw - 1200px)/2));display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #ffffff1c;font-size:14px;gap:12px}header a{color:#c6d3e8;text-decoration:none}.hero{max-width:1200px;margin:auto;padding:72px 24px 48px;display:grid;grid-template-columns:1.3fr 1fr;align-items:end;gap:30px}.eyebrow{color:#f6c983;letter-spacing:.18em;font-size:12px;font-weight:700}h1{font-size:clamp(36px,6vw,70px);line-height:1.13;letter-spacing:-.04em;margin:18px 0}p{line-height:1.8;color:#b7c1d0;margin:0}.intro{max-width:460px}.intro strong{display:block;color:#f8ead5;margin-top:20px;font-weight:500}.wrap{max-width:1200px;margin:auto;padding:0 24px 90px}.original{display:flex;align-items:center;gap:26px;background:#1c2735;border:1px solid #ffffff20;border-radius:20px;padding:18px;margin-bottom:60px}.original img{width:108px;height:165px;object-fit:cover;object-position:top;border-radius:10px}.original h2{margin:0 0 8px;font-size:22px}.original a{display:inline-flex;margin-top:12px;color:#f6c983;min-height:48px;align-items:center}.section{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:24px}.section h2{font-size:30px;margin:0}.section span{color:#99a9bd;font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px}.card{appearance:none;text-align:left;padding:0;overflow:hidden;border:1px solid #ffffff1b;border-radius:16px;background:#1b2230;color:inherit;cursor:pointer;font:inherit;transition:transform .2s,border-color .2s}.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:#e6bd7e;outline:none}.card img{width:100%;aspect-ratio: .72;object-fit:cover;object-position:top;display:block;background:#293342}.card .copy{padding:17px 17px 20px}.number{color:#e7bd83;font-size:12px;letter-spacing:.1em}.card h3{font-size:19px;margin:8px 0}.card p{font-size:13px;line-height:1.6;min-height:42px}.card .open{display:block;margin-top:12px;color:#d7e2f2;font-size:13px}dialog{padding:0;border:1px solid #ffffff2b;border-radius:18px;background:#141a25;color:#fff;width:min(900px,96vw);max-height:94dvh}dialog::backdrop{background:#05070bdc}.dialog-head{display:flex;justify-content:space-between;gap:16px;align-items:center;padding:16px 20px;position:sticky;top:0;background:#141a25;z-index:1}.dialog-head h2{font-size:20px;margin:0}.dialog-head button{border:1px solid #ffffff45;border-radius:50%;width:48px;height:48px;background:none;color:white;font-size:26px;cursor:pointer}.dialog-content{display:flex;gap:24px;align-items:start;padding:0 20px 24px}.dialog-content img{width:min(58%,460px);height:auto;border-radius:10px}.dialog-content p{padding-top:8px}.dialog-content a{display:inline-flex;align-items:center;min-height:48px;color:#f6c983}footer{border-top:1px solid #ffffff1c;padding:25px 24px;color:#99a9bd;font-size:13px;text-align:center}@media(max-width:760px){.hero{grid-template-columns:1fr;padding-top:50px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card .copy{padding:13px}.card h3{font-size:17px}.card p{font-size:12px}.section{align-items:start;flex-direction:column}.dialog-content{display:block}.dialog-content img{width:100%}.original{align-items:flex-start}.original img{width:82px;height:145px}}@media(max-width:350px){.grid{grid-template-columns:1fr}}
</style></head><body><header><span>THEME EXPLORATIONS / 主题探索</span><a href="#gallery">浏览方案 ↓</a></header><main><section class="hero"><div><div class="eyebrow">SLIDING GAME · CONCEPT COLLECTION</div><h1>同一种滑行，<br>不同的世界。</h1></div><div class="intro"><p>从雪道出发，探索古墓、幽灵车站、失物仓库与更多想象中的目的地。</p><strong>13 个微恐与奇幻主题方向，供视觉讨论。</strong></div></section><div class="wrap"><section class="original"><a href="images/original.jpg" target="_blank" rel="noopener"><img src="images/original.jpg" alt="滑雪游戏原版运行截图"></a><div><div class="eyebrow">REFERENCE / 原版参考</div><h2>原版游戏截图</h2><p>企鹅乘坐蓝色滑板，从后方视角沿雪道向前滑行。</p><a href="images/original.jpg" target="_blank" rel="noopener">查看原版大图 ↗</a></div></section><div class="section" id="gallery"><div><div class="eyebrow">THE COLLECTION</div><h2>主题方案图集</h2></div><span>点击任意方案查看完整效果图</span></div><div class="grid" id="grid"></div></div></main><footer>原版为游戏运行截图；主题画面为 AI 生成的概念效果图，尚未接入游戏。</footer><dialog id="detail"><div class="dialog-head"><h2 id="title"></h2><button id="close" aria-label="关闭">×</button></div><div class="dialog-content"><img id="large" alt=""><div><p id="description"></p><a id="full" target="_blank" rel="noopener">打开原尺寸图片 ↗</a></div></div></dialog><script>
fetch('items.json').then(r=>r.json()).then(items=>{const grid=document.querySelector('#grid'),dialog=document.querySelector('#detail');items.forEach(([slug,title,description],i)=>{const b=document.createElement('button');b.className='card';b.innerHTML=`<img src="images/${slug}-thumb.webp" alt="" loading="lazy"><div class="copy"><span class="number">${String(i+1).padStart(2,'0')} / CONCEPT</span><h3>${title}</h3><p>${description}</p><span class="open">查看效果图 ↗</span></div>`;b.addEventListener('click',()=>{document.querySelector('#title').textContent=title;document.querySelector('#description').textContent=description+' 本图为 AI 生成的概念展示，尚未接入游戏。';const image=document.querySelector('#large');image.src=`images/${slug}.png`;image.alt=title+'主题概念效果图';document.querySelector('#full').href=image.src;dialog.showModal()});grid.append(b)});document.querySelector('#close').onclick=()=>dialog.close();dialog.addEventListener('click',e=>{if(e.target===dialog)dialog.close()})}).catch(()=>{document.querySelector('#grid').textContent='图集加载失败，请刷新页面。'});
</script></body></html>
